<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密码 · 志询增长运营平台</title>
  <link rel="icon" type="image/png" href="./assets/zx-browser-icon.png" />
  <link rel="apple-touch-icon" href="./assets/zx-browser-icon-180.png" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; color: #e2e8f0; background: linear-gradient(135deg,#0f172a,#1e293b 50%,#312e81); }
    .card { width: 100%; max-width: 460px; padding: 38px 40px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; backdrop-filter: blur(20px); box-shadow: 0 25px 80px rgba(0,0,0,.38); }
    h1 { font-size: 24px; text-align: center; margin-bottom: 8px; } .subtitle { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 28px; }
    .message { display: none; margin-bottom: 18px; padding: 10px 14px; border-radius: 10px; text-align: center; font-size: 13px; line-height: 1.5; } .message.show { display:block; } .error { color:#fca5a5; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.25); } .success { color:#86efac; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.25); }
    .group { margin-bottom: 17px; } label { display:block; margin-bottom:8px; color:#cbd5e1; font-size:13px; } input { width:100%; height:46px; padding:0 14px; border-radius:11px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); color:#fff; outline:0; font-size:14px; } input:focus { border-color:#818cf8; box-shadow:0 0 0 4px rgba(99,102,241,.12); } .code-row { display:flex; gap:10px; } .code-row input { flex:1; } button { border:0; border-radius:11px; cursor:pointer; font-size:14px; } .send-code { flex:0 0 125px; color:#c7d2fe; background:rgba(99,102,241,.2); border:1px solid rgba(129,140,248,.5); } button:disabled { opacity:.55; cursor:not-allowed; } .submit { width:100%; height:46px; margin-top:7px; color:#fff; font-weight:600; background:linear-gradient(135deg,#6366f1,#8b5cf6); } .actions { display:flex; justify-content:space-between; margin-top:18px; font-size:13px; } a { color:#a5b4fc; text-decoration:none; } a:hover { text-decoration:underline; } .phone-note { margin-top:-8px; margin-bottom:18px; color:#94a3b8; font-size:12px; }
    @media(max-width:480px) { .card { padding:32px 24px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="pageTitle">修改密码</h1><p class="subtitle" id="pageSubtitle">为保护账号安全，需要验证旧密码和手机验证码</p>
    <div id="message" class="message"></div>
    <p id="phoneNote" class="phone-note">正在读取绑定手机号…</p>
    <form id="passwordForm">
      <div class="group"><label for="oldPassword">旧密码</label><input id="oldPassword" type="password" autocomplete="current-password" placeholder="请输入旧密码" required /></div>
      <div class="group"><label for="newPassword">新密码</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="至少6位字符" required /></div>
      <div class="group"><label for="confirmPassword">确认新密码</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入新密码" required /></div>
      <div class="group" id="verificationGroup"><label for="verificationCode">手机验证码</label><div class="code-row"><input id="verificationCode" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码" required /><button type="button" class="send-code" id="sendCode">获取验证码</button></div></div>
      <button type="submit" class="submit" id="submitButton">确认修改</button>
    </form>
    <div class="actions"><a href="/" id="homeLink">返回平台</a><a href="/login.html" id="logoutLink">退出登录</a></div>
  </main>
  <script src="./auth-helper.js?v=3"></script>
  <script>
    const message = document.getElementById('message'); const phoneNote = document.getElementById('phoneNote'); const sendCode = document.getElementById('sendCode'); const form = document.getElementById('passwordForm'); const submitButton = document.getElementById('submitButton'); const params = new URLSearchParams(window.location.search); const isForced = params.get('force') === '1'; const mobileEntry = params.get('from') === 'mobile'; const mobileLogin = mobileEntry ? '/mobile/login.html' : '/login.html'; const mobileHome = mobileEntry ? '/mobile/#/dashboard' : '/'; let countdownTimer;
    document.getElementById('homeLink').href = mobileHome;
    document.getElementById('logoutLink').href = mobileLogin;
    if (!ZhiXunAuth.isAuthenticated()) window.location.replace(mobileLogin);
    if (isForced) { document.getElementById('pageTitle').textContent = '首次登录，请修改密码'; document.getElementById('pageSubtitle').textContent = '临时密码仅限首次登录使用，请设置新的登录密码'; document.getElementById('verificationGroup').hidden = true; document.getElementById('verificationCode').required = false; document.getElementById('phoneNote').textContent = '修改成功后，临时密码将立即失效'; }
    (async function loadUser() { if (isForced) return; try { const resp = await ZhiXunAuth.get('/api/auth/me'); const data = await resp.json(); if (!resp.ok) throw new Error(data.error); phoneNote.textContent = data.user.phone_masked ? `验证码将发送至 ${data.user.phone_masked}` : '当前账号未绑定手机号'; } catch (error) { showMessage(error.message || '读取账号信息失败', true); } })();
    sendCode.addEventListener('click', async () => { sendCode.disabled = true; try { const resp = await ZhiXunAuth.post('/api/auth/send-code', { purpose: 'password' }); const data = await resp.json(); if (!resp.ok) throw new Error(data.error || '验证码发送失败'); showMessage(`${data.message}${data.debug_code ? `（演示验证码：${data.debug_code}）` : ''}`); startCountdown(); } catch (error) { showMessage(error.message, true); sendCode.disabled = false; } });
    form.addEventListener('submit', async (event) => { event.preventDefault(); const old_password = document.getElementById('oldPassword').value; const new_password = document.getElementById('newPassword').value; const verification_code = document.getElementById('verificationCode').value.trim(); if (new_password !== document.getElementById('confirmPassword').value) return showMessage('两次输入的新密码不一致', true); submitButton.disabled = true; try { const resp = await ZhiXunAuth.fetch('/api/auth/password', { method: 'PUT', body: JSON.stringify({ old_password, new_password, verification_code, force_reset: isForced }) }); const data = await resp.json(); if (!resp.ok) throw new Error(data.error || '密码修改失败'); ZhiXunAuth.clearSession(); showMessage('密码修改成功，请使用新密码重新登录'); form.reset(); setTimeout(() => { window.location.href = mobileLogin; }, 1200); } catch (error) { showMessage(error.message, true); submitButton.disabled = false; } });
    document.getElementById('logoutLink').addEventListener('click', () => ZhiXunAuth.clearSession());
    function startCountdown() { let seconds = 60; sendCode.textContent = `${seconds}s后重试`; clearInterval(countdownTimer); countdownTimer = setInterval(() => { seconds -= 1; sendCode.textContent = seconds ? `${seconds}s后重试` : '获取验证码'; if (!seconds) { clearInterval(countdownTimer); sendCode.disabled = false; } }, 1000); }
    function showMessage(text, isError) { message.textContent = text; message.className = `message show ${isError ? 'error' : 'success'}`; }
  </script>
</body>
</html>
