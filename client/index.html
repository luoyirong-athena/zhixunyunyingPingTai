<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>志询 · 增长运营平台</title>
  <link rel="icon" type="image/png" href="./assets/zx-browser-icon.png" />
  <link rel="apple-touch-icon" href="./assets/zx-browser-icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    /* ====== 全局重置 ====== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ====== SPA 区域 ====== */
    html.auth-checking #root { visibility: hidden; }
    #root { min-height: 100vh; }

    /* ====== 登录遮罩层 ====== */
    #loginOverlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      align-items: center; justify-content: center; padding: 20px; overflow-y: auto;
    }
    #loginOverlay.show { display: flex; }

    #loginOverlay::before {
      content: ''; position: fixed; inset: -50%; width: 200%; height: 200%; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,.15), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(59,130,246,.1), transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(139,92,246,.08), transparent 50%);
    }

    .login-container {
      position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 42px 40px;
      background: rgba(255,255,255,.04); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 25px 80px rgba(0,0,0,.4);
    }
    .logo-area { text-align: center; margin-bottom: 30px; }
    .logo-icon {
      width: 56px; height: 56px; background: linear-gradient(135deg,#6366f1,#8b5cf6); border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(99,102,241,.35);
    }
    .logo-title { font-size: 26px; font-weight: 700; color: #f1f5f9; letter-spacing: 1px; }
    .logo-subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; letter-spacing: 2px; }
    .login-tabs { display: flex; gap: 6px; padding: 4px; margin-bottom: 24px; background: rgba(15,23,42,.45); border-radius: 12px; }
    .login-tab { flex: 1; height: 36px; border: 0; border-radius: 9px; background: transparent; color: #94a3b8; cursor: pointer; font-size: 14px; }
    .login-tab.active { color: #fff; background: rgba(99,102,241,.85); box-shadow: 0 4px 14px rgba(99,102,241,.2); }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 8px; letter-spacing: .5px; }
    .input-wrapper { position: relative; }
    .input-wrapper .icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; pointer-events: none; display: flex; }
    .form-group input { width: 100%; height: 48px; padding: 0 16px 0 44px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; font-size: 15px; color: #f1f5f9; outline: none; transition: all .25s ease; }
    .form-group input::placeholder { color: #64748b; }
    .form-group input:focus { border-color: #6366f1; background: rgba(255,255,255,.06); box-shadow: 0 0 0 4px rgba(99,102,241,.1); }
    .password-hint-box {
      display: none; margin-top: 9px; padding: 9px 11px;
      border-radius: 9px; background: rgba(99,102,241,.1);
      border: 1px solid rgba(129,140,248,.2);
      color: #c7d2fe; font-size: 12px; line-height: 1.5;
    }
    .password-hint-box.show { display: block; }
    .code-row { display: flex; gap: 10px; }
    .code-row .input-wrapper { flex: 1; }
    .btn-code { width: 124px; flex: 0 0 124px; height: 48px; border: 1px solid rgba(129,140,248,.55); border-radius: 12px; background: rgba(99,102,241,.15); color: #c7d2fe; cursor: pointer; font-size: 13px; }
    .btn-code:hover:not(:disabled) { background: rgba(99,102,241,.28); }
    .btn-code:disabled { opacity: .55; cursor: not-allowed; }
    .btn-login { width: 100%; height: 48px; background: linear-gradient(135deg,#6366f1,#8b5cf6); border: none; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer; letter-spacing: 1px; transition: all .3s ease; margin-top: 8px; position: relative; overflow: hidden; }
    .btn-login:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(99,102,241,.4); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-login .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; margin-right: 8px; vertical-align: middle; }
    .btn-login.loading .spinner { display: inline-block; } .btn-login.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg, .success-msg { font-size: 13px; padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; display: none; text-align: center; line-height: 1.5; }
    .error-msg { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
    .success-msg { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25); color: #86efac; }
    .show { display: block; }
    .password-link { display: block; text-align: center; margin-top: 14px; color: #a5b4fc; font-size: 13px; text-decoration: none; }
    .password-link:hover { color: #c7d2fe; text-decoration: underline; }
    .register-panel { display: none; }
    .register-panel.show { display: block; }
    .mode-tab-register.active { background: rgba(34,197,94,.85); box-shadow: 0 4px 14px rgba(34,197,94,.2); }
    @media (max-width: 480px) { .login-container { padding: 34px 24px; border-radius: 20px; } .logo-title { font-size: 22px; } .code-row { gap: 8px; } .btn-code { width: 112px; flex-basis: 112px; } }
  </style>
</head>
<body>

<!-- ====== SPA 根节点 ====== -->
<div id="root"></div>

<!-- ====== 登录/注册遮罩层 ====== -->
<div id="loginOverlay">
  <div class="login-container">
    <div class="logo-area">
      <div class="logo-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="logo-title">志询 · 增长运营平台</div><div class="logo-subtitle">ZHI XUN GROWTH PLATFORM</div>
    </div>
    <div class="login-tabs" role="tablist">
      <button type="button" class="login-tab active" data-mode="login">登 录</button>
      <button type="button" class="login-tab mode-tab-register" data-mode="register">注 册</button>
    </div>
    <div class="error-msg" id="errorMsg"></div><div class="success-msg" id="successMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><input type="text" id="username" placeholder="请输入用户名" autocomplete="username" /></div>
      </div>
      <div class="form-group password-field">
        <label for="password">密码</label>
        <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" /></div>
        <div class="password-hint-box" id="passwordHint" aria-live="polite"></div>
      </div>
      <button type="submit" class="btn-login" id="btnLogin"><span class="spinner"></span><span class="btn-text">登 录</span></button>
    </form>
    <!-- 注册表单面板 -->
    <div class="register-panel" id="registerPanel">
      <form id="registerForm">
        <div class="form-group">
          <label for="regUsername">用户名</label>
          <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><input type="text" id="regUsername" placeholder="请输入用户名" autocomplete="username" /></div>
        </div>
        <div class="form-group">
          <label for="regDisplayName">显示名称 <span style="color:#64748b;font-weight:400;">（可选）</span></label>
          <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><input type="text" id="regDisplayName" placeholder="给自己起个名字吧" autocomplete="name" /></div>
        </div>
        <div class="form-group">
          <label for="regPassword">密码</label>
          <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="regPassword" placeholder="至少6位密码" autocomplete="new-password" /></div>
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">确认密码</label>
          <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="regConfirmPassword" placeholder="再次输入密码" autocomplete="new-password" /></div>
        </div>
        <div class="form-group">
          <label for="regPasswordHint">密码提示 <span style="color:#64748b;font-weight:400;">（可选）</span></label>
          <div class="input-wrapper"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-1.1.9-1.7 1.3-1.7 2.7"/><path d="M12 17h.01"/></svg></span><input type="text" id="regPasswordHint" maxlength="80" placeholder="用于登录时提示自己，可不填写" autocomplete="off" /></div>
        </div>
        <button type="submit" class="btn-login" id="btnRegister"><span class="spinner"></span><span class="btn-text">注 册</span></button>
      </form>
    </div>
  </div>
</div>


<!-- ====== 认证工具库 ====== -->
<script src="./runtime-config.js?v=1"></script>
<script src="./auth-helper.js?v=3"></script>

<!-- ====== 主逻辑：认证判断 + 登录/注册 + SPA 加载 ====== -->
<script>
(function() {
  // Keep the root entry point on the same login experience as /login.html.
  if (!ZhiXunAuth.isAuthenticated()) {
    window.location.replace('/login.html');
    return;
  }

  var overlay = document.getElementById('loginOverlay');
  var root = document.getElementById('root');

  // 加载 SPA 脚本并显示用户工具栏
  function loadSPA() {
    overlay.classList.remove('show');
    root.style.visibility = '';

    // 加载一站式运营平台样式
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = './one-stop.css?v=20260924-025';
    document.head.appendChild(link);

    var petLink = document.createElement('link');
    petLink.rel = 'stylesheet';
    petLink.href = './zx-pet.css?v=20260909-001';
    document.head.appendChild(petLink);

    // 先加载本地 Excel 组件，再启动一站式应用
    function startOneStopApp() {
      if (document.getElementById('oneStopAppScript')) return;
      var script = document.createElement('script');
      script.id = 'oneStopAppScript';
      script.src = './one-stop.js?v=20261008-005';
      document.head.appendChild(script);
      if (!document.getElementById('zxPetScript')) {
        var petScript = document.createElement('script');
        petScript.id = 'zxPetScript';
        petScript.type = 'module';
        petScript.src = './zx-pet.js?v=20260929-002';
        document.head.appendChild(petScript);
      }
    }
    // ExcelJS from local + XLSX for import; always start SPA
    var loadTimer=setTimeout(startOneStopApp, 5000);
    var exceljs=document.createElement('script');
    exceljs.src='./vendor/exceljs.min.js';
    exceljs.onload=function(){clearTimeout(loadTimer);startOneStopApp()};
    exceljs.onerror=function(){clearTimeout(loadTimer);startOneStopApp()};
    document.head.appendChild(exceljs);
    var xlsx=document.createElement('script');
    xlsx.src='./vendor/xlsx.full.min.js?v=0.18.5';
    document.head.appendChild(xlsx);
    var jszip=document.createElement('script');
    jszip.src='./vendor/jszip.min.js?v=3.10.1';
    document.head.appendChild(jszip);
  }

  // 登录/注册成功后的回调
  function onAuthSuccess() {
    overlay.classList.remove('show');
    loadSPA();
  }

  // 已登录 → 直接加载 SPA
  if (ZhiXunAuth.isAuthenticated()) {
    loadSPA();
    return;
  }

  // 未登录 → 显示登录遮罩
  overlay.classList.add('show');
  root.style.visibility = 'hidden';

  // ====== 登录/注册表单逻辑 ======
  var loginForm = document.getElementById('loginForm');
  var btnLogin = document.getElementById('btnLogin');
  var errorMsg = document.getElementById('errorMsg');
  var successMsg = document.getElementById('successMsg');
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var passwordHint = document.getElementById('passwordHint');
  var registerPanel = document.getElementById('registerPanel');
  var registerForm = document.getElementById('registerForm');
  var btnRegister = document.getElementById('btnRegister');

  // 选项卡切换
  document.querySelectorAll('.login-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.login-tab').forEach(function(item) { item.classList.toggle('active', item === tab); });
      var isRegister = tab.dataset.mode === 'register';
      loginForm.style.display = isRegister ? 'none' : '';
      registerPanel.classList.toggle('show', isRegister);
      if (isRegister) hidePasswordHint();
      hideMessages();
    });
  });

  var hintTimer = null;
  var hintRequestId = 0;

  usernameInput.addEventListener('input', function() {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(loadPasswordHint, 350);
  });
  usernameInput.addEventListener('blur', function() {
    clearTimeout(hintTimer);
    loadPasswordHint();
  });

  async function loadPasswordHint() {
    var username = usernameInput.value.trim();
    var requestId = ++hintRequestId;
    if (!username) return hidePasswordHint();
    try {
      var resp = await fetch('/api/auth/password-hint?username=' + encodeURIComponent(username));
      var data = await resp.json();
      if (requestId !== hintRequestId || username !== usernameInput.value.trim()) return;
      if (resp.ok && data.hint) {
        passwordHint.textContent = '密码提示：' + data.hint;
        passwordHint.classList.add('show');
      } else {
        hidePasswordHint();
      }
    } catch (error) {
      hidePasswordHint();
    }
  }

  function hidePasswordHint() {
    passwordHint.textContent = '';
    passwordHint.classList.remove('show');
  }

  // 登录提交
  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault(); hideMessages();
    var username = usernameInput.value.trim();
    var password = passwordInput.value;

    if (!username || !password) return showError('请输入用户名和密码');

    setLoginLoading(true);
    try {
      var resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, password: password }) });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '登录失败');
      ZhiXunAuth.setSession(data.token, data.user);
      onAuthSuccess();
    } catch (err) { showError(err.message); setLoginLoading(false); }
  });

  // 注册提交
  registerForm.addEventListener('submit', async function(e) {
    e.preventDefault(); hideMessages();
    var username = document.getElementById('regUsername').value.trim();
    var displayName = document.getElementById('regDisplayName').value.trim();
    var password = document.getElementById('regPassword').value;
    var confirmPassword = document.getElementById('regConfirmPassword').value;
    var passwordHintValue = document.getElementById('regPasswordHint').value.trim();

    if (!username) return showError('请输入用户名');
    if (passwordHintValue.length > 80) return showError('密码提示不能超过80个字符');
    if (password.length < 6) return showError('密码长度不能少于6位');
    if (password !== confirmPassword) return showError('两次输入的密码不一致');

    setRegLoading(true);
    try {
      var resp = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, password: password, confirm_password: confirmPassword, display_name: displayName || undefined, password_hint: passwordHintValue || undefined }) });
      var data = await resp.json();
      if (!resp.ok) throw new Error(data.error || '注册失败');
      ZhiXunAuth.setSession(data.token, data.user);
      onAuthSuccess();
    } catch (err) { showError(err.message); setRegLoading(false); }
  });

  // ====== 工具函数 ======
  function setLoginLoading(loading) { btnLogin.classList.toggle('loading', loading); btnLogin.disabled = loading; }
  function setRegLoading(loading) { btnRegister.classList.toggle('loading', loading); btnRegister.disabled = loading; }
  function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('show'); successMsg.classList.remove('show'); }
  function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.add('show'); errorMsg.classList.remove('show'); }
  function hideMessages() { errorMsg.classList.remove('show'); successMsg.classList.remove('show'); }
})();
</script>

</body>
</html>
