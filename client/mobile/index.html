<body class="zx-mobile-layout">
  <div id="root" class="zx-mobile-root"></div>
  <script>
    (function () {
      if (!window.MutationObserver || window.__zxMobileSafeMutationObserver) return;
      var nativeObserve = window.MutationObserver.prototype.observe;
      window.MutationObserver.prototype.observe = function (target, options) {
        if (!target || typeof target.nodeType !== 'number') return;
        return nativeObserve.call(this, target, options);
      };
      window.__zxMobileSafeMutationObserver = true;
    }());
  </script>
  <script src="../runtime-config.js?v=1"></script>
  <script src="../auth-helper.js?v=3"></script>
  <script src="./app.js?v=20261010-008"></script>
